const SECOES = {"cover": "Abertura: o termômetro do denim e as três forças da temporada", "div-fit": "Modelagens: o que sobe, o que fica e quais artigos sustentam cada caimento", "div-cor": "Cores, lavagens, superfícies e detalhes ligados aos artigos das fichas técnicas", "div-mercado": "Comportamento do consumidor e práticas no online e na loja física", "div-treino": "Treinamento: como transformar ficha técnica em argumento de venda"};
const stage = document.getElementById("stage"), scaler = document.getElementById("scaler");
let atual = 0;
try{ const q = new URLSearchParams(location.hash.slice(1)).get("l"); if(q) atual = Math.max(0, Math.min(SLIDES.length-1, parseInt(q,10)-1||0)); }catch(e){}
function secaoDe(i){ let d = ""; for(let k=0;k<=i;k++){ if(SECOES[SLIDES[k].id]) d = SECOES[SLIDES[k].id]; } return d; }
function escala(){ const w = stage.clientWidth, h = stage.clientHeight; const s = Math.min(w/1920, h/1080); scaler.style.transform = `translate(${(w-1920*s)/2}px,${(h-1080*s)/2}px) scale(${s})`; }
function mostrar(i){
  atual = (i + SLIDES.length) % SLIDES.length;
  scaler.innerHTML = SLIDES[atual].html;
  document.getElementById("count").textContent = (atual+1) + " / " + SLIDES.length;
  document.getElementById("notaTxt").textContent = SLIDES[atual].nota || "Sem notas nesta lâmina.";
  document.getElementById("secao").textContent = secaoDe(atual);
  document.querySelectorAll(".thumb").forEach((t,k)=>t.setAttribute("aria-current", String(k===atual)));
  try{ history.replaceState(null, "", "#l=" + (atual+1)); }catch(e){}
  escala();
}
["prev","zprev"].forEach(id=>document.getElementById(id).addEventListener("click", ()=>mostrar(atual-1)));
["next","znext"].forEach(id=>document.getElementById(id).addEventListener("click", ()=>mostrar(atual+1)));
document.addEventListener("keydown", e=>{
  if(e.target.closest("input,textarea")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); mostrar(atual+1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); mostrar(atual-1); }
});
let tx=null; stage.addEventListener("touchstart", e=>{ tx = e.touches[0].clientX; }, {passive:true});
stage.addEventListener("touchend", e=>{ if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; if(Math.abs(dx)>40) mostrar(atual + (dx<0?1:-1)); tx=null; });
const nb = document.getElementById("notasBtn");
nb.addEventListener("click", ()=>{ const on = nb.getAttribute("aria-pressed")!=="true"; nb.setAttribute("aria-pressed", String(on)); document.getElementById("notas").hidden = !on; });
document.getElementById("fsBtn").addEventListener("click", ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else if(stage.requestFullscreen) stage.requestFullscreen().catch(()=>{});
  else if(stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
});
document.addEventListener("fullscreenchange", ()=>setTimeout(escala, 50));
const thumbs = document.getElementById("thumbs");
SLIDES.forEach((s,k)=>{
  const b = document.createElement("button"); b.type="button"; b.className="thumb";
  const tit = (s.html.match(/<h[12][^>]*>([\s\S]*?)<\/h[12]>/)||[,""])[1].replace(/<[^>]+>/g,"");
  b.innerHTML = `<div class="tv"><div class="scaler">${s.html}</div></div><span>${k+1}. </span>`;
  b.querySelector("span").textContent = (k+1) + ". " + tit;
  b.addEventListener("click", ()=>{ mostrar(k); stage.scrollIntoView({behavior:"smooth", block:"center"}); });
  thumbs.appendChild(b);
});
function escalaThumbs(){ const t = thumbs.querySelector(".tv"); if(t) thumbs.style.setProperty("--ts", t.clientWidth/1920); }
new ResizeObserver(()=>{ escala(); escalaThumbs(); }).observe(document.body);
const PDF_URL = "denim-radar-2026-27.pdf", PDF_NOME = "Denim Radar 2026-27.pdf";
function aviso(t){ const m = document.getElementById("shareMsg"); m.textContent = t; m.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(()=>{ m.hidden = true; }, 5000); }
document.getElementById("shareBtn").addEventListener("click", async (ev) => {
  const btn = ev.currentTarget, txt = btn.textContent; btn.textContent = "Preparando…"; btn.disabled = true;
  const link = new URL(PDF_URL, location.href).href;
  try{
    if(navigator.canShare){
      const blob = await fetch(PDF_URL).then(r => { if(!r.ok) throw new Error(); return r.blob(); });
      const file = new File([blob], PDF_NOME, {type:"application/pdf"});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Denim Radar 2026–27", text:"Pesquisa de tendências em jeans e denim · Studio Denim"}); aviso("PDF compartilhado."); return; }
    }
    if(navigator.share){ await navigator.share({title:"Denim Radar 2026–27", url:link}); aviso("Link compartilhado."); return; }
    await navigator.clipboard.writeText(link); aviso("Link do PDF copiado. Cole no WhatsApp ou no e-mail. Quem receber o link abre o PDF sem senha.");
  }catch(e){
    if(e && e.name === "AbortError"){ return; }
    try{ await navigator.clipboard.writeText(link); aviso("Link do PDF copiado. Cole no WhatsApp ou no e-mail."); }
    catch(e2){ aviso("Não foi possível compartilhar daqui. Use “Baixar PDF” e envie o arquivo."); }
  }finally{ btn.textContent = txt; btn.disabled = false; }
});
mostrar(atual); escalaThumbs();
</script>
