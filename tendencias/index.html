<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tendências · CRM Studio Denim</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<script>try{ if(!sessionStorage.getItem('sd_carteira_chave')) location.replace('../'); }catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=DM+Sans:wght@400..700&display=swap">
<style>
  html{-webkit-text-size-adjust:100%;} body{margin:0;} [hidden]{display:none!important;} img{max-width:100%;}
  /* Layout: coluna única — cabeçalho índigo, pesquisa do agente, painel de indicadores, lista de atrasados em destaque. */
  :root{
    --bg:#f4f7fb; --surface:#ffffff; --surface-2:#fbfcff; --ink:#1c2233; --muted:#646b78; --border:#d5dfee;
    --title:#0a2c5e; --accent:#0b3c7d; --accent-strong:#0b3c7d; --accent-fg:#ffffff; --link:#1c5fb0;
    --tint:#e6eef8; --tint-strong:#cfdcf0;
    --rust:#c0392b; --rust-light:#fbeceb; --rust-ink:#8f2419; --rust-solid:#c0392b; --rust-solid-fg:#ffffff; --rust-border:#f0c4be;
    --warn:#a8520f; --warn-bg:#fdf1e4;
    --good:#0b7a45; --good-bg:#e4f5eb;
    --head-a:#061f45; --head-b:#0a2c5e; --head-c:#0b3c7d; --head-fg:#ffffff; --head-muted:#cfdcf0; --stitch:#3d8fd6; --head-chip:rgba(255,255,255,.12);
    --font: 'Poppins','Segoe UI',Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#08111f; --surface:#0f1b2f; --surface-2:#132238; --ink:#e7edf7; --muted:#9aa8bf; --border:#233654;
      --title:#cfe0f7; --accent:#6fb0ee; --accent-strong:#1c5fb0; --accent-fg:#ffffff; --link:#7fb8ee;
      --tint:#15294a; --tint-strong:#1f3a66;
      --rust:#ff8375; --rust-light:#3a1a1c; --rust-ink:#ffb4a8; --rust-solid:#c0392b; --rust-solid-fg:#ffffff; --rust-border:#6a2a27;
      --warn:#f0a35e; --warn-bg:#3a2815;
      --good:#4fd08e; --good-bg:#12301f;
      --head-a:#040d1c; --head-b:#08204a; --head-c:#0b3c7d; --head-fg:#ffffff; --head-muted:#cfdcf0; --stitch:#3d8fd6; --head-chip:rgba(255,255,255,.12);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#08111f; --surface:#0f1b2f; --surface-2:#132238; --ink:#e7edf7; --muted:#9aa8bf; --border:#233654;
    --title:#cfe0f7; --accent:#6fb0ee; --accent-strong:#1c5fb0; --accent-fg:#ffffff; --link:#7fb8ee;
    --tint:#15294a; --tint-strong:#1f3a66;
    --rust:#ff8375; --rust-light:#3a1a1c; --rust-ink:#ffb4a8; --rust-solid:#c0392b; --rust-solid-fg:#ffffff; --rust-border:#6a2a27;
    --warn:#f0a35e; --warn-bg:#3a2815;
    --good:#4fd08e; --good-bg:#12301f;
    --head-a:#040d1c; --head-b:#08204a; --head-c:#0b3c7d; --head-fg:#ffffff; --head-muted:#cfdcf0; --stitch:#3d8fd6; --head-chip:rgba(255,255,255,.12);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--font); background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5; padding-inline:16px; padding-block:20px 40px;}
  .wrap{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:18px;}
  button, input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--stitch); outline-offset:2px;}

  /* Cabeçalho */
  .top{
    background:linear-gradient(135deg, var(--head-a) 0%, var(--head-b) 55%, var(--head-c) 100%);
    color:var(--head-fg); border-radius:14px; padding:22px 26px; border:1px solid var(--head-c);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; position:relative;
  }
  .top::after{ /* pesponto */
    content:""; position:absolute; left:14px; right:14px; bottom:7px; border-bottom:2px dashed var(--stitch); opacity:.55; pointer-events:none;
  }
  .brand{display:flex; align-items:center; gap:16px; flex-wrap:wrap; min-width:0;}
  .wordmark{display:inline-flex; flex-direction:column; line-height:1; font-weight:800;}
  .wordmark .studio{font-size:10px; font-weight:600; letter-spacing:6px; color:var(--head-muted);}
  .wordmark .denim{font-size:30px; letter-spacing:1px; margin-top:4px;}
  .divider{width:1px; height:40px; background:var(--head-fg); opacity:.3;}
  .top h1{margin:0; font-size:19px; font-weight:700; letter-spacing:.3px; text-wrap:balance;}
  .top .subtitle{margin:2px 0 0; font-size:12.5px; color:var(--head-muted);}
  .filebox{display:flex; flex-direction:column; align-items:flex-end; gap:8px; min-width:0;}
  .filechip{background:var(--head-chip); border-radius:10px; padding:8px 12px; font-size:12px; max-width:100%; text-align:right;}
  .filechip b{display:block; font-weight:600; font-size:12.5px; overflow-wrap:anywhere;}
  .filechip span{color:var(--head-muted);}
  .btn-light{background:var(--head-fg); color:var(--head-b); border:0; border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer;}
  .btn-light:hover{background:var(--head-muted);}
  .btn-light:disabled{opacity:.6; cursor:progress;}
  .filemsg{font-size:11.5px; color:var(--head-muted); text-align:right; min-height:1em;}


  /* Menu de módulos do CRM */
  .modnav{flex-basis:100%; display:flex; gap:6px; overflow-x:auto; padding:12px 2px 2px; border-top:1px solid rgba(255,255,255,.16); scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .modnav::-webkit-scrollbar{display:none;}
  .modnav a{white-space:nowrap; text-decoration:none; color:var(--head-muted); font-size:13px; font-weight:600; padding:8px 14px; border-radius:8px; background:var(--head-chip); display:inline-flex; gap:7px; align-items:center; flex:0 0 auto;}
  .modnav a:hover{color:var(--head-fg); background:rgba(255,255,255,.22);}
  .modnav a[aria-current="page"]{background:var(--head-fg); color:var(--head-b);}
  .modnav .soon{font-size:9.5px; text-transform:uppercase; letter-spacing:.6px; background:var(--stitch); color:#fff; border-radius:10px; padding:1px 7px; font-weight:700;}
  .modnav .ext{font-size:11px; opacity:.8;}
  @media (max-width:600px){ .modnav{flex-wrap:wrap;} .modnav a{padding:7px 11px; font-size:12.5px;} }

  .deckbar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between;}
  .deckbar h2{margin:0; font-size:18px; color:var(--title);}
  .deckbar p{margin:2px 0 0; color:var(--muted); font-size:13px;}
  .ctrls{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .cbtn{background:var(--surface); color:var(--title); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .cbtn:hover{border-color:var(--accent);}
  .cbtn[aria-pressed="true"]{background:var(--accent-strong); color:#fff; border-color:var(--accent-strong);}
  .cbtn.pdf{background:var(--accent-strong); color:#fff; border-color:var(--accent-strong); text-decoration:none; display:inline-flex; align-items:center;}
  .cbtn.pdf:hover{filter:brightness(1.1);}
  .sharemsg{margin:0; background:var(--good-bg); color:var(--good); border-radius:10px; padding:10px 14px; font-size:13px; font-weight:600;}
  .count{font-variant-numeric:tabular-nums; font-weight:700; color:var(--muted); min-width:64px; text-align:center;}
  .stage{position:relative; width:100%; aspect-ratio:16/9; background:#0E1A33; border-radius:12px; overflow:hidden; border:1px solid var(--border);}
  .stage:fullscreen{border-radius:0; border:0; background:#000;}
  .scaler{position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0;}
  .scaler > section{position:absolute; inset:0; width:1920px; height:1080px; box-sizing:border-box; overflow:hidden;}
  .scaler section *{box-sizing:border-box;}
  .scaler section p, .scaler section h1, .scaler section h2, .scaler section h3, .scaler section ul{margin:0;}
  .scaler section ul{padding-left:1.2em;} .scaler section li{margin:0 0 .35em;}
  .scaler section > *{position:relative;}
  .scaler section table{width:100%; border-collapse:collapse;}
  .scaler section th{text-align:left; font-weight:700; padding:14px 18px; border-bottom:3px solid currentColor; opacity:.95;}
  .scaler section td{padding:14px 18px; border-bottom:1px solid rgba(14,26,51,.18); vertical-align:top;}
  .scaler section a{color:inherit;}
  .scaler section img{max-width:none;}
  .navzone{position:absolute; top:0; bottom:0; width:18%; border:0; background:transparent; cursor:pointer; z-index:2;}
  .navzone.prev{left:0;} .navzone.next{right:0;}
  .notes{background:var(--surface); border:1px solid var(--border); border-left:4px solid #F2C230; border-radius:12px; padding:14px 18px; color:var(--ink); font-size:14px; line-height:1.6;}
  .notes b{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:4px;}
  .thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
  .thumb{border:2px solid transparent; border-radius:8px; padding:0; background:var(--surface); cursor:pointer; text-align:left; overflow:hidden; color:var(--ink);}
  .thumb[aria-current="true"]{border-color:var(--accent);}
  .thumb .tv{position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#0E1A33; pointer-events:none;}
  .thumb .tv .scaler{transform:scale(var(--ts,.08));}
  .thumb span{display:block; font-size:11.5px; padding:5px 8px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .secao{font-size:12px; color:var(--muted);}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="wordmark" aria-label="Studio Denim"><span class="studio">STUDIO</span><span class="denim">DENIM</span></div>
      <div class="divider" aria-hidden="true"></div>
      <div>
        <h1>Tendências</h1>
        <p class="subtitle">Denim Radar · modelagens, cores, consumidor e argumentos de venda</p>
      </div>
    </div>
    <nav class="modnav" aria-label="Módulos do CRM">
      <a href="../">Carteira</a>
      <a href="../calculadora/">Calculadora de consumo</a>
      <a href="../tendencias/" aria-current="page">Tendências</a>
      <a href="../reclamacao/">Reclamação de qualidade</a>
      <a href="../arquivos/">Arquivos</a>
    </nav>
  </header>
  <section class="deckbar">
    <div>
      <h2>Denim Radar 2026–27</h2>
      <p id="secao">Pesquisa de tendências · outubro 2026</p>
    </div>
    <div class="ctrls">
      <button class="cbtn" type="button" id="prev" aria-label="Lâmina anterior">←</button>
      <span class="count" id="count" aria-live="polite">1 / 1</span>
      <button class="cbtn" type="button" id="next" aria-label="Próxima lâmina">→</button>
      <button class="cbtn" type="button" id="notasBtn" aria-pressed="false">Notas</button>
      <button class="cbtn" type="button" id="fsBtn">Tela cheia</button>
      <a class="cbtn pdf" id="pdfBtn" href="denim-radar-2026-27.pdf" download="Denim Radar 2026-27.pdf">Baixar PDF</a>
      <button class="cbtn pdf" type="button" id="shareBtn">Compartilhar</button>
    </div>
  </section>
  <div class="stage" id="stage">
    <div class="scaler" id="scaler"></div>
    <button class="navzone prev" type="button" aria-label="Lâmina anterior" id="zprev"></button>
    <button class="navzone next" type="button" aria-label="Próxima lâmina" id="znext"></button>
  </div>
  <p class="sharemsg" id="shareMsg" aria-live="polite" hidden></p>
  <div class="notes" id="notas" hidden><b>Notas do apresentador</b><span id="notaTxt"></span></div>
  <div class="thumbs" id="thumbs" aria-label="Todas as lâminas"></div>
</div>
<script>
const SLIDES = [{"id": "cover", "html": "<section id=\"cover\" data-transition=\"fade\" style=\"background:#0E1A33;color:#F3EFE6;font-family:'DM Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n<img src=\"img/8b2baff2730f2ef212a9f4906c25c147.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Três modelos vestindo jaquetas e camisas jeans\" style=\"position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover\">\n<div style=\"position:absolute;left:0;top:0;width:1920px;height:1080px;background:linear-gradient(90deg, rgba(14,26,51,0.96) 0%, rgba(14,26,51,0.85) 45%, rgba(14,26,51,0.1) 80%)\"><\/div>\n<p style=\"font-size:32px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#F2C230;width:900px\">Pesquisa de tendências · outubro 2026<\/p>\n<h1 style=\"font-family:'Oswald', Arial, sans-serif;font-size:200px;font-weight:700;line-height:1;text-transform:uppercase;width:1000px\">Denim Radar<\/h1>\n<p style=\"font-size:44px;line-height:1.3;color:#F3EFE6;width:880px\">O que o mundo está vestindo em jeans e quais artigos das nossas fichas técnicas respondem a isso.<\/p>\n<p style=\"font-size:32px;color:#B9C4D9;width:880px\">Verão 27 · Inverno 27 · para lojistas e vendedores de atacado<\/p>\n\n<\/section>", "nota": "Abra dizendo que este material é um radar, não uma bíblia: ele junta o que vimos nas passarelas e feiras (Milão, Paris, Kingpins, Denim Première Vision), nos dados de consumo e na nossa própria pesquisa de campo do CapriTrends, e traduz tudo para os artigos que temos na ficha técnica. As fotos são da viagem de pesquisa Londres–Paris do CapriTrends 2026."}, {"id": "radar", "html": "<section id=\"radar\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">O radar em uma página<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Termômetro da temporada<\/h2>\n<\/div>\n<div style=\"display:flex;gap:32px;flex:1\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:20px;background:#FBF9F4;padding:40px;border-radius:16px;border-top:12px solid #1E40AF\">\n<h3 style=\"font-family:'Oswald', Arial, sans-serif;font-size:44px;font-weight:600;text-transform:uppercase;color:#1E40AF\">Subindo<\/h3>\n<ul style=\"font-size:30px;line-height:1.45;color:#0E1A33\">\n<li>Bootcut e flare suave<\/li>\n<li>Reta slim (“pin‑straight”)<\/li>\n<li>Capri, pantacourt e bermuda longa<\/li>\n<li>Brown, areia e tons terrosos<\/li>\n<li>Índigo escuro quase preto<\/li>\n<li>Jeans branco de alfaiataria<\/li>\n<li>Look total jeans<\/li>\n<\/ul>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:20px;background:#FBF9F4;padding:40px;border-radius:16px;border-top:12px solid #0E1A33\">\n<h3 style=\"font-family:'Oswald', Arial, sans-serif;font-size:44px;font-weight:600;text-transform:uppercase\">Forte, consolidado<\/h3>\n<ul style=\"font-size:30px;line-height:1.45;color:#0E1A33\">\n<li>Wide e reta solta<\/li>\n<li>Barrel e balloon com volume controlado<\/li>\n<li>Lavagem vintage limpa<\/li>\n<li>100% algodão de 10 a 14 oz<\/li>\n<li>Invisible stretch (1% elastano)<\/li>\n<li>Jaqueta e camisa jeans<\/li>\n<\/ul>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:20px;background:#ECE6DA;padding:40px;border-radius:16px;border-top:12px solid #8A8F99\">\n<h3 style=\"font-family:'Oswald', Arial, sans-serif;font-size:44px;font-weight:600;text-transform:uppercase;color:#4A5263\">Perdendo fôlego<\/h3>\n<ul style=\"font-size:30px;line-height:1.45;color:#4A5263\">\n<li>Baggy extremo, sem estrutura<\/li>\n<li>Destroyed genérico (o novo é o desgaste com intenção)<\/li>\n<li>Skinny superelástica<\/li>\n<li>Logo grande e óbvio<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#4A5263\">Fontes: CapriTrends 2026, Who What Wear, FashionUnited, Maker’s Row, Candiani (ver lâmina de fontes)<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">2<\/p>\n\n<\/section>", "nota": "Use esta lâmina como resumo para quem tem 2 minutos. A ideia central: o volume não morreu, ele amadureceu. O que cresce é o caimento mais limpo (reta slim e bootcut) e as cores fora do azul médio. O que perde força é o exagero sem propósito. Pergunte ao lojista: em qual coluna está a maior parte da sua arara hoje?"}, {"id": "forcas", "html": "<section id=\"forcas\" data-transition=\"fade\" style=\"background:#0E1A33;color:#F3EFE6;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:56px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#F2C230\">Por trás das tendências<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Três forças movem o jeans agora<\/h2>\n<\/div>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;flex:1\">\n<div style=\"display:flex;flex-direction:column;gap:24px;border-top:2px solid #F2C230;padding:40px 0 0 0\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:120px;font-weight:700;line-height:1;color:#F2C230\">01<\/p>\n<h3 style=\"font-size:44px;font-weight:700;line-height:1.2\">Do volume para a proporção<\/h3>\n<p style=\"font-size:30px;line-height:1.45;color:#B9C4D9\">Depois de anos de baggy, o caimento fica mais pensado: volume com controle e a volta da perna reta mais fina.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:24px;border-top:2px solid #F2C230;padding:40px 0 0 0\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:120px;font-weight:700;line-height:1;color:#F2C230\">02<\/p>\n<h3 style=\"font-size:44px;font-weight:700;line-height:1.2\">Do básico para o detalhe<\/h3>\n<p style=\"font-size:30px;line-height:1.45;color:#B9C4D9\">“Se todo mundo faz o básico, não gera desejo.” Textura, cor e acabamento viram o motivo da compra.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:24px;border-top:2px solid #F2C230;padding:40px 0 0 0\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:120px;font-weight:700;line-height:1;color:#F2C230\">03<\/p>\n<h3 style=\"font-size:44px;font-weight:700;line-height:1.2\">Da arara para a tela<\/h3>\n<p style=\"font-size:30px;line-height:1.45;color:#B9C4D9\">A compra começa no vídeo. No TikTok Shop Brasil, calça feminina é o item de moda mais vendido.<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#B9C4D9\">Fontes: CapriTrends 2026; TikTok Newsroom, jun/2026<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#B9C4D9;text-align:right\">3<\/p>\n\n<\/section>", "nota": "Estas três forças explicam quase tudo o que vem depois. Proporção: o cliente já tem calça larga no armário, então a próxima compra precisa ser diferente. Detalhe: o lojista que só repõe básico disputa preço com todo mundo. Tela: o consumidor final vê o caimento no vídeo antes de pisar na loja, então o lojista precisa de peça que fica bem na câmera."}, {"id": "div-fit", "html": "<section id=\"div-fit\" data-transition=\"push\" style=\"background:#1E40AF;color:#F3EFE6;font-family:'DM Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n<p style=\"font-size:32px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#F2C230\">Parte 1<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:160px;font-weight:700;line-height:1;text-transform:uppercase\">Modelagens<\/h2>\n<p style=\"font-size:44px;line-height:1.3;width:1100px\">Cada caimento pede um tecido. Aqui o peso e o elastano viram argumento.<\/p>\n\n<\/section>", "nota": "Transição para a parte de modelagens. Lembre ao time: quem compra tecido está comprando um caimento. Sempre conecte a modelagem ao peso (oz) e ao elastano."}, {"id": "mapa-fits", "html": "<section id=\"mapa-fits\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Mapa de silhuetas<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Sete caimentos para ler a arara<\/h2>\n<\/div>\n<div style=\"display:flex;gap:24px;flex:1\">\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;background:#FBF9F4;padding:28px 16px;border-radius:16px\">\n<svg aria-label=\"Silhueta de calça barrel, pernas curvadas para fora no joelho\" width=\"120\" height=\"300\" viewBox=\"0 0 120 300\" style=\"width:144px;height:360px\"><path d=\"M26 4 L94 4 L98 64 Q120 180 94 292 L66 292 Q76 180 60 84 Q44 180 54 292 L26 292 Q0 180 22 64 Z\" fill=\"#2B4C8C\"/><rect x=\"26\" y=\"4\" width=\"68\" height=\"10\" fill=\"#14274F\"/><\/svg>\n<h3 style=\"font-family:'Oswald', Arial, sans-serif;font-size:36px;font-weight:600;text-transform:uppercase\">Barrel<\/h3>\n<p style=\"font-size:24px;font-weight:700;background:#E2DDD2;color:#4A5263;padding:6px 16px;border-radius:999px\">Consolidado<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;background:#FBF9F4;padding:28px 16px;border-radius:16px\">\n<svg aria-label=\"Silhueta de calça balloon, volume no quadril afinando na barra\" width=\"120\" height=\"300\" viewBox=\"0 0 120 300\" style=\"width:144px;height:360px\"><path d=\"M26 4 L94 4 Q124 150 90 292 L64 292 Q66 160 60 84 Q54 160 56 292 L30 292 Q-4 150 26 4 Z\" fill=\"#2B4C8C\"/><rect x=\"26\" y=\"4\" width=\"68\" height=\"10\" fill=\"#14274F\"/><\/svg>\n<h3 style=\"font-family:'Oswald', Arial, sans-serif;font-size:36px;font-weight:600;text-transform:uppercase\">Balloon<\/h3>\n<p style=\"font-size:24px;font-weight:700;background:#E2DDD2;color:#4A5263;padding:6px 16px;border-radius:999px\">Consolidado<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;background:#FBF9F4;padding:28px 16px;border-radius:16px\">\n<svg aria-label=\"Silhueta de calça wide leg, perna ampla do quadril à barra\" width=\"120\" height=\"300\" viewBox=\"0 0 120 300\" style=\"width:144px;height:360px\"><path d=\"M26 4 L94 4 L98 64 L114 292 L62 292 L60 84 L58 292 L6 292 L22 64 Z\" fill=\"#2B4C8C\"/><rect x=\"26\" y=\"4\" width=\"68\" height=\"10\" fill=\"#14274F\"/><\/svg>\n<h3 style=\"font-family:'Oswald', Arial, sans-serif;font-size:36px;font-weight:600;text-transform:uppercase\">Wide<\/h3>\n<p style=\"font-size:24px;font-weight:700;background:#0E1A33;color:#F3EFE6;padding:6px 16px;border-radius:999px\">Forte<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;background:#FBF9F4;padding:28px 16px;border-radius:16px\">\n<svg aria-label=\"Silhueta de calça reta\" width=\"120\" height=\"300\" viewBox=\"0 0 120 300\" style=\"width:144px;height:360px\"><path d=\"M26 4 L94 4 L98 64 L100 292 L64 292 L60 84 L56 292 L20 292 L22 64 Z\" fill=\"#2B4C8C\"/><rect x=\"26\" y=\"4\" width=\"68\" height=\"10\" fill=\"#14274F\"/><\/svg>\n<h3 style=\"font-family:'Oswald', Arial, sans-serif;font-size:36px;font-weight:600;text-transform:uppercase\">Reta<\/h3>\n<p style=\"font-size:24px;font-weight:700;background:#0E1A33;color:#F3EFE6;padding:6px 16px;border-radius:999px\">Base forte<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;background:#FBF9F4;padding:28px 16px;border-radius:16px\">\n<svg aria-label=\"Silhueta de calça slim reta, perna fina e reta\" width=\"120\" height=\"300\" viewBox=\"0 0 120 300\" style=\"width:144px;height:360px\"><path d=\"M26 4 L94 4 L98 64 L92 292 L66 292 L60 84 L54 292 L28 292 L22 64 Z\" fill=\"#2B4C8C\"/><rect x=\"26\" y=\"4\" width=\"68\" height=\"10\" fill=\"#14274F\"/><\/svg>\n<h3 style=\"font-family:'Oswald', Arial, sans-serif;font-size:36px;font-weight:600;text-transform:uppercase\">Slim reta<\/h3>\n<p style=\"font-size:24px;font-weight:700;background:#1E40AF;color:#F3EFE6;padding:6px 16px;border-radius:999px\">Subindo<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;background:#FBF9F4;padding:28px 16px;border-radius:16px\">\n<svg aria-label=\"Silhueta de calça bootcut, justa no joelho abrindo na barra\" width=\"120\" height=\"300\" viewBox=\"0 0 120 300\" style=\"width:144px;height:360px\"><path d=\"M26 4 L94 4 L98 64 L92 190 L104 292 L62 292 L66 190 L60 84 L54 190 L58 292 L16 292 L28 190 L22 64 Z\" fill=\"#2B4C8C\"/><rect x=\"26\" y=\"4\" width=\"68\" height=\"10\" fill=\"#14274F\"/><\/svg>\n<h3 style=\"font-family:'Oswald', Arial, sans-serif;font-size:36px;font-weight:600;text-transform:uppercase\">Bootcut<\/h3>\n<p style=\"font-size:24px;font-weight:700;background:#1E40AF;color:#F3EFE6;padding:6px 16px;border-radius:999px\">Subindo<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;background:#FBF9F4;padding:28px 16px;border-radius:16px\">\n<svg aria-label=\"Silhueta de calça capri, reta e cortada abaixo do joelho\" width=\"120\" height=\"300\" viewBox=\"0 0 120 300\" style=\"width:144px;height:360px\"><path d=\"M26 4 L94 4 L98 64 L94 222 L66 222 L60 84 L54 222 L26 222 L22 64 Z\" fill=\"#2B4C8C\"/><rect x=\"26\" y=\"4\" width=\"68\" height=\"10\" fill=\"#14274F\"/><\/svg>\n<h3 style=\"font-family:'Oswald', Arial, sans-serif;font-size:36px;font-weight:600;text-transform:uppercase\">Capri<\/h3>\n<p style=\"font-size:24px;font-weight:700;background:#F2C230;color:#0E1A33;padding:6px 16px;border-radius:999px\">Aposta V27<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#4A5263\">Fontes: CapriTrends 2026, Who What Wear (verão 26 e 2027), Steal The Look (jul/2026), Maker’s Row<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">5<\/p>\n\n<\/section>", "nota": "Leia da esquerda para a direita: do mais volumoso ao mais enxuto. Barrel e balloon continuam vendendo, mas já são conhecidos; o lojista precisa deles na grade, não como novidade. A reta é a base que gira o ano todo. A novidade comercial está na slim reta e no bootcut, que a imprensa de moda já chama de “a nova silhueta padrão” depois do barrel. Capri e pantacourt aparecem como aposta de verão 27 nas passarelas de Nova York e nas listas de tendência brasileiras."}, {"id": "volume", "html": "<section id=\"volume\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Barrel · Balloon · Wide<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Volume pede tecido que segura a forma<\/h2>\n<\/div>\n<div style=\"display:flex;gap:56px;flex:1\">\n<div style=\"display:flex;gap:16px\">\n<img src=\"img/098e79de3d68f1e1dfdb98192d1de9a7.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Calça barrel escura com lavagem suja em loja\" style=\"width:290px;height:600px;object-fit:cover;border-radius:12px\">\n<img src=\"img/e2684af1cd8e330e13ba00ae32e75e0a.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Calça balloon azul claro em arara\" style=\"width:290px;height:600px;object-fit:cover;border-radius:12px\">\n<img src=\"img/f47d9196145a33078436deafc40c5e3a.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Calça wide de lavagem média em manequim\" style=\"width:290px;height:600px;object-fit:cover;border-radius:12px\">\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:28px\">\n<p style=\"font-size:30px;line-height:1.45;color:#4A5263\">Algodão rígido e encorpado mantém a curva do joelho e a barra no lugar depois da lavagem. Na pesquisa de campo, 90% do denim visto estava entre 10 e 14 oz.<\/p>\n<table style=\"font-size:26px;color:#0E1A33\">\n<tr><th style=\"width:42%\">Artigo<\/th><th style=\"width:28%\">Peso<\/th><th style=\"width:30%\">Composição<\/th><\/tr>\n<tr><td>Algarve 12 oz<\/td><td>12 oz<\/td><td>100% algodão<\/td><\/tr>\n<tr><td>Algarve 13 oz<\/td><td>13 oz<\/td><td>100% algodão<\/td><\/tr>\n<tr><td>Algarve 14 oz<\/td><td>14,2 oz<\/td><td>100% algodão<\/td><\/tr>\n<tr><td>Albatroz<\/td><td>12,5 oz<\/td><td>100% algodão<\/td><\/tr>\n<tr><td>Tanguá<\/td><td>12 oz<\/td><td>80% alg. + 20% resíduo<\/td><\/tr>\n<\/table>\n<p style=\"font-size:26px;line-height:1.4;color:#1E40AF;font-weight:700\">Balloon mais fluido: Algarve 10 oz, Brava e Pipa (10 oz).<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#4A5263\">Fichas técnicas Capricórnio · Fotos: CapriTrends 2026, Londres e Paris<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">6<\/p>\n\n<\/section>", "nota": "Argumento para o lojista: barrel em tecido leve vira calça larga sem forma, e o cliente final percebe na primeira lavada. A família Algarve agora vai de 10 a 14 oz; o 13 e o 14 são lançamentos e dão aquele aspecto heritage, encorpado. Tanguá tem 20% de resíduos têxteis, um ótimo gancho de sustentabilidade. Para balloon com mais caimento e movimento, desça para 10 oz. Encolhimento: Algarve 13 e 14 têm trama de -4%, os demais -2%."}, {"id": "slim", "html": "<section id=\"slim\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Slim reta · Bootcut · Flare<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">A nova skinny não aperta<\/h2>\n<\/div>\n<div style=\"display:flex;gap:56px;flex:1\">\n<img src=\"img/f6788de3a1515a8543494a0303986882.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Calça preta de perna reta e fina segurada em loja\" style=\"width:460px;height:600px;object-fit:cover;border-radius:12px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:28px\">\n<p style=\"font-size:30px;line-height:1.45;color:#4A5263\">A perna afina de novo, mas com aparência de algodão rígido. O “invisible stretch” (99% algodão, 1% elastano) atende quem não vive sem elastano e aparece no feminino e no masculino.<\/p>\n<table style=\"font-size:26px;color:#0E1A33\">\n<tr><th style=\"width:30%\">Artigo<\/th><th style=\"width:20%\">Peso<\/th><th style=\"width:22%\">Elastano<\/th><th style=\"width:28%\">Elasticidade<\/th><\/tr>\n<tr><td>Lamar<\/td><td>11 oz<\/td><td>1%<\/td><td>8–12%<\/td><\/tr>\n<tr><td>Salles<\/td><td>11,5 oz<\/td><td>1%<\/td><td>ver ficha<\/td><\/tr>\n<tr><td>Torres<\/td><td>10 oz<\/td><td>1%<\/td><td>ver ficha<\/td><\/tr>\n<tr><td>Alcaraz<\/td><td>11,5 oz<\/td><td>1%<\/td><td>19–23%<\/td><\/tr>\n<tr><td>Ibira Flex<\/td><td>10,5 oz<\/td><td>2%<\/td><td>23–27%<\/td><\/tr>\n<tr><td>Bosco<\/td><td>11 oz<\/td><td>2%<\/td><td>40–44%<\/td><\/tr>\n<\/table>\n<p style=\"font-size:26px;line-height:1.4;color:#1E40AF;font-weight:700\">Atenção ao modelista: Bosco encolhe −20% na trama e Nadal −23%.<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#4A5263\">Fichas técnicas Capricórnio · CapriTrends 2026 · Who What Wear, verão 2026<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">7<\/p>\n\n<\/section>", "nota": "Aqui está a maior oportunidade de venda nova da temporada. Depois do barrel, a imprensa aponta o bootcut mais fino e a reta slim (pin-straight) como o novo padrão, mas o cliente não quer voltar ao aperto da skinny antiga. Por isso o argumento é: parece rígido, veste fácil. Lamar, Salles, Torres e Alcaraz são as apostas da Capri com 1% de elastano. Para quem quer mais conforto, Ibira Flex e Bosco com 2%. A elasticidade é a da trama, medida em tecido lavado."}, {"id": "verao", "html": "<section id=\"verao\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Verão 27<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Capri, bermuda longa, saia e vestido<\/h2>\n<\/div>\n<div style=\"display:flex;gap:48px;flex:1\">\n<div style=\"display:flex;gap:16px\">\n<img src=\"img/a494f66aae0cfd6b1b739a7e2f01bfce.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Bermuda jeans longa clara pendurada\" style=\"width:250px;height:600px;object-fit:cover;border-radius:12px\">\n<img src=\"img/0894489611c2c60ae69f577f71262189.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Saia jeans escura midi em cabide\" style=\"width:250px;height:600px;object-fit:cover;border-radius:12px\">\n<img src=\"img/3c6e2a4c701e114db899d670438d05f7.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Vestido jeans claro com recortes em arara\" style=\"width:250px;height:600px;object-fit:cover;border-radius:12px\">\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:24px\">\n<p style=\"font-size:30px;line-height:1.45;color:#4A5263\">Nas passarelas de verão 27: capri ajustada, microshort desfiado, bermuda longa e saia em todos os comprimentos. O peso desce e o caimento ganha movimento.<\/p>\n<div style=\"display:flex;flex-direction:column;gap:12px;background:#FBF9F4;padding:28px 32px;border-radius:16px\">\n<h3 style=\"font-size:30px;font-weight:700;color:#1E40AF\">Leves, 100% algodão<\/h3>\n<p style=\"font-size:26px;line-height:1.4\">Araguaia 8,5 oz · Borba 9 oz · Braga 9 oz · Una 9,5 oz<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:12px;background:#FBF9F4;padding:28px 32px;border-radius:16px\">\n<h3 style=\"font-size:30px;font-weight:700;color:#1E40AF\">Fluidos, para saia e vestido<\/h3>\n<p style=\"font-size:26px;line-height:1.4\">Glória 8,4 oz (37% liocel) · Luna 4,9 oz (25% liocel) · Liz 5 oz · Eva 5,5 oz<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#4A5263\">Fontes: Who What Wear 2027, CHNews (out/2026), Steal The Look (jul/2026) · Fichas técnicas Capricórnio<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">8<\/p>\n\n<\/section>", "nota": "Verão no Brasil pede peso menor. A CapriTrends já apontava UNA, Araguaia, Glória e Borba como apostas abaixo de 10 oz. Glória tem liocel, o que dá toque mais frio e caimento fluido, ótimo para saia midi e vestido. A linha Light (Luna, Liz, Eva) atende camisaria e vestidos leves. Capri e pantacourt são o ponto polêmico: vale oferecer em grade curta, como teste, ao lojista mais ousado."}, {"id": "div-cor", "html": "<section id=\"div-cor\" data-transition=\"push\" style=\"background:#F2C230;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n<p style=\"font-size:32px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#0E1A33\">Parte 2<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:160px;font-weight:700;line-height:1;text-transform:uppercase\">Cor, superfície e detalhe<\/h2>\n<p style=\"font-size:44px;line-height:1.3;width:1200px\">O que faz alguém parar na frente da arara.<\/p>\n\n<\/section>", "nota": "Segunda parte: aqui está o “desejo”. Modelagem resolve o caimento; cor, textura e detalhe resolvem a vontade de comprar."}, {"id": "paleta", "html": "<section id=\"paleta\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Colorimetria<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Seis famílias de cor e onde encontrá-las<\/h2>\n<\/div>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:24px;flex:1\">\n<div style=\"display:flex;background:#FBF9F4;border-radius:16px;overflow:hidden\">\n<div style=\"width:96px;background:#1B2440\"><\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;padding:28px\">\n<h3 style=\"font-size:32px;font-weight:700\">Índigo quase preto<\/h3>\n<p style=\"font-size:24px;line-height:1.4;color:#4A5263\">Algarve 10 oz Dark Blue · Blue Black: Algarve, Albatroz, Una, Salles, Torres<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;background:#FBF9F4;border-radius:16px;overflow:hidden\">\n<div style=\"width:96px;background:#8FB0D6\"><\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;padding:28px\">\n<h3 style=\"font-size:32px;font-weight:700\">Azul claro<\/h3>\n<p style=\"font-size:24px;line-height:1.4;color:#4A5263\">Baby Blue: Algarve, Borba, Braga, Bosco, Nadal, Trancoso Max · Angel Blue: Sagi, Cipó<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;background:#FBF9F4;border-radius:16px;overflow:hidden\">\n<div style=\"width:96px;background:#8C6B4F\"><\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;padding:28px\">\n<h3 style=\"font-size:32px;font-weight:700\">Brown e areia<\/h3>\n<p style=\"font-size:24px;line-height:1.4;color:#4A5263\">Algarve 10 oz Baby Blue Brown e Baby Black Brown · artigos PT para tingir em peça<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;background:#FBF9F4;border-radius:16px;overflow:hidden\">\n<div style=\"width:96px;background:#C9A6C8\"><\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;padding:28px\">\n<h3 style=\"font-size:32px;font-weight:700\">Rosa e lavanda<\/h3>\n<p style=\"font-size:24px;line-height:1.4;color:#4A5263\">Algarve 10 oz Baby Blue Melon · Baby Blue Royal: Algarve 10 e 12 oz, Ibira Flex<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;background:#FBF9F4;border-radius:16px;overflow:hidden\">\n<div style=\"width:96px;background:#2E2E33\"><\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;padding:28px\">\n<h3 style=\"font-size:32px;font-weight:700\">Preto e cinza<\/h3>\n<p style=\"font-size:24px;line-height:1.4;color:#4A5263\">Black Black: Algarve, Alcaraz, Bosco, Nadal, Tanguá · Baby Black lava para cinza<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;background:#FBF9F4;border-radius:16px;overflow:hidden\">\n<div style=\"width:96px;background:#E9E1CF;border-right:1px solid #D6CDB8\"><\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;padding:28px\">\n<h3 style=\"font-size:32px;font-weight:700\">Branco e cru<\/h3>\n<p style=\"font-size:24px;line-height:1.4;color:#4A5263\">Trindade e Ubá Branco/NAT · Lee e Monte Branco · Rues NAT<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#4A5263\">Fontes: CapriTrends 2026, Who What Wear, FashionUnited, Denim Première Vision SS27 · Fichas técnicas Capricórnio<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">10<\/p>\n\n<\/section>", "nota": "A colorimetria da CapriTrends (médios, Intense, Blue Black, Dark Blue, claros, brown, black e cinzas) bate com o que a imprensa internacional mostrou. Índigo quase preto aparece nos desfiles de verão 27 (Carven, Tibi, The Row). Azul claro e rosa pálido vêm forte para o verão. Brown e areia (cáqui) estão em alta desde 2026, com Loewe, Dior e Calvin Klein. A Première Vision destacou baby blue, azul lavanda e preto profundo. Branco aparece como calça de alfaiataria larga."}, {"id": "brown", "html": "<section id=\"brown\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Brown denim · Color denim<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Cor nova sem sair do denim<\/h2>\n<\/div>\n<div style=\"display:flex;gap:56px;flex:1\">\n<img src=\"img/17a278d2dbb4a2e9bdc4b02d1f17bbe2.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Calça jeans marrom com bolsos aparentes em arara\" style=\"width:420px;height:600px;object-fit:cover;border-radius:12px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:32px\">\n<p style=\"font-size:30px;line-height:1.45;color:#4A5263\">O coating tinge a superfície do tecido. Com a lavagem, a base azul ou preta aparece por baixo e cria um tom envelhecido que não se consegue só com tingimento de peça.<\/p>\n<div style=\"display:flex;gap:24px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FBF9F4;padding:20px;border-radius:16px\">\n<img src=\"img/9b36651d00bdbef672c3d7b6917f8ca4.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Amostras do Algarve Baby Blue Brown em quatro lavagens\" style=\"width:300px;height:160px;object-fit:contain;background:#FBF9F4\">\n<h3 style=\"font-size:26px;font-weight:700\">Baby Blue Brown<\/h3>\n<p style=\"font-size:24px;color:#4A5263\">Algarve 10 oz<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FBF9F4;padding:20px;border-radius:16px\">\n<img src=\"img/b3ae63154b8f9faf4f0bc575f67a193d.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Amostras do Algarve Baby Black Brown em quatro lavagens\" style=\"width:300px;height:160px;object-fit:contain;background:#FBF9F4\">\n<h3 style=\"font-size:26px;font-weight:700\">Baby Black Brown<\/h3>\n<p style=\"font-size:24px;color:#4A5263\">Algarve 10 oz<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:#FBF9F4;padding:20px;border-radius:16px\">\n<img src=\"img/dec117c5b13dac561b18263d4c1dd4e7.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Amostras do Algarve Baby Blue Melon, do azul ao rosa\" style=\"width:300px;height:160px;object-fit:contain;background:#FBF9F4\">\n<h3 style=\"font-size:26px;font-weight:700\">Baby Blue Melon<\/h3>\n<p style=\"font-size:24px;color:#4A5263\">Algarve 10 oz<\/p>\n<\/div>\n<\/div>\n<p style=\"font-size:26px;line-height:1.4;color:#1E40AF;font-weight:700\">Todos 100% algodão, sarja 3x1, encolhimento de −2%: o mesmo molde da base Algarve.<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#4A5263\">Fontes: CapriTrends 2026, Trendalytics (brown denim), Steal The Look · Fichas técnicas Capricórnio<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">11<\/p>\n\n<\/section>", "nota": "Brown denim é a cor fora do azul com mais força desde 2026, com Loewe, Dior e Calvin Klein nas passarelas e tons chocolate, café e caramelo no varejo. No Brasil, a “calça estonada em marrom” aparece entre as apostas de 2027. O Melon puxa para o rosa e conversa com o rosa pálido do verão. Argumento de venda forte: o lojista usa o mesmo molde que já vende no Algarve, porque o encolhimento é igual, e ganha uma cor nova na arara sem risco de modelagem."}, {"id": "branco", "html": "<section id=\"branco\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Branco · Cru · Pronto para tingir<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">A cor da vez, na hora certa<\/h2>\n<\/div>\n<div style=\"display:flex;gap:56px;flex:1\">\n<div style=\"display:flex;gap:16px\">\n<img src=\"img/2b74c08db85c717d0109eb24ad5749b0.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Calças jeans cinza claro penduradas\" style=\"width:260px;height:600px;object-fit:cover;border-radius:12px\">\n<img src=\"img/4d048aed03faf200f0a60c011e5bac6a.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Calça jeans cor areia em detalhe\" style=\"width:260px;height:600px;object-fit:cover;border-radius:12px\">\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:28px\">\n<p style=\"font-size:30px;line-height:1.45;color:#4A5263\">Calça branca larga de alfaiataria, cáqui areia e cores pontuais. Com o artigo PT, a confecção tinge em peça a cor que está girando, sem estoque de cor parada.<\/p>\n<table style=\"font-size:26px;color:#0E1A33\">\n<tr><th style=\"width:24%\">Artigo<\/th><th style=\"width:22%\">Peso<\/th><th style=\"width:54%\">Ideia de uso<\/th><\/tr>\n<tr><td>Trindade<\/td><td>11 oz<\/td><td>calça branca larga, cargo<\/td><\/tr>\n<tr><td>Ubá<\/td><td>8,8 oz<\/td><td>calça e saia de verão<\/td><\/tr>\n<tr><td>Lee<\/td><td>9,5 oz · 1% el.<\/td><td>branca com conforto<\/td><\/tr>\n<tr><td>Monte<\/td><td>7,5 oz · 1,5% el.<\/td><td>bermuda e saia color<\/td><\/tr>\n<tr><td>Graça<\/td><td>7 oz<\/td><td>camisaria e vestido<\/td><\/tr>\n<tr><td>Rues<\/td><td>7,5 oz · 2% el.<\/td><td>calça flat de toque liso<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#4A5263\">Fontes: Who What Wear (verão 2026), ELLE Brasil (mai/2026) · Fichas técnicas Capricórnio<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">12<\/p>\n\n<\/section>", "nota": "Versões disponíveis: Trindade e Ubá em Branco óptico, NAT, Preto e PT; Lee em Branco, NAT, Preto e PT; Monte em Branco, NAT, Preto, PT e Tinto; Graça em NAT, Preto, PT e Tinto; Rues em NAT, Preto e Tinto. A coluna “ideia de uso” é sugestão de pesquisa, não especificação do fabricante. A ELLE Brasil listou o jeans branco (Ellus, J’01) entre os modelos que definem o momento, e o Who What Wear trouxe a calça branca de perna larga como substituta da branca justa."}, {"id": "superficie", "html": "<section id=\"superficie\" data-transition=\"fade\" style=\"background:#0E1A33;color:#F3EFE6;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#F2C230\">Texturas · Família Bossa<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Quando o tecido já é o detalhe<\/h2>\n<\/div>\n<div style=\"display:flex;gap:48px;flex:1\">\n<div style=\"display:flex;gap:16px\">\n<img src=\"img/db5ed0fae1e73f4c8a4a0af6c79ba168.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Calça jeans clara com desenho em relevo no tecido\" style=\"width:260px;height:600px;object-fit:cover;border-radius:12px\">\n<img src=\"img/1e5a6d4bb2b1e2e83abb6a6d7a68dc36.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Jeans com estampa paisley feita a laser\" style=\"width:260px;height:600px;object-fit:cover;border-radius:12px\">\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:28px\">\n<p style=\"font-size:30px;line-height:1.45;color:#B9C4D9\">Maquinetado, multi-sarja, laser e acabamento brilhante. A textura diferencia a peça sem custo extra de lavanderia.<\/p>\n<img src=\"img/0e864703efb8e68a44745212fc7f484f.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Amostras do Geribá maquinetado em quatro lavagens\" style=\"width:520px;height:240px;object-fit:contain;background:#F3EFE6;border-radius:12px\">\n<table style=\"font-size:26px;color:#F3EFE6\">\n<tr><th style=\"width:30%\">Artigo<\/th><th style=\"width:34%\">Ligamento<\/th><th style=\"width:36%\">Peso<\/th><\/tr>\n<tr><td>Geribá · Taíba · Atins<\/td><td>Maquinetado<\/td><td>10,2 oz · 100% algodão<\/td><\/tr>\n<tr><td>Preá · Jeri<\/td><td>Maquinetado<\/td><td>10 oz · 100% algodão<\/td><\/tr>\n<tr><td>Sagi<\/td><td>Multi-sarja<\/td><td>10 oz · Angel Blue<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#B9C4D9\">Fontes: CapriTrends 2026, Who What Wear 2027, CHNews · Fichas técnicas Capricórnio<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#B9C4D9;text-align:right\">13<\/p>\n\n<\/section>", "nota": "“Invista em texturas para trazer diferenciação” é uma das conclusões do CapriTrends. Nas passarelas de verão 27 apareceram acabamentos brilhantes e encerados (Acne Studios, Diesel, Gucci), craquelado e textura de croco. No comercial, o caminho mais seguro é o maquinetado: o desenho está no próprio tecido. Atenção: Geribá encolhe −8% na trama; Taíba, Atins e Sagi −2%. Preá também existe em Baby Black e Black."}, {"id": "detalhes", "html": "<section id=\"detalhes\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Detalhes que geram desejo<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">O básico com um motivo a mais<\/h2>\n<\/div>\n<div style=\"display:flex;gap:24px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<img src=\"img/8195d78136b17af4812273e9ad6f5d19.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Jaqueta jeans acinturada com barra desfiada\" style=\"width:398px;height:400px;object-fit:cover;border-radius:12px\">\n<h3 style=\"font-size:30px;font-weight:700\">Cintura marcada<\/h3>\n<p style=\"font-size:24px;line-height:1.35;color:#4A5263\">Jaqueta e colete acinturados, recortes que desenham o corpo.<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<img src=\"img/528d38960b6d81aa72f36ec6f2d7b00f.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Calça jeans com bolsos de renda aplicada\" style=\"width:398px;height:400px;object-fit:cover;border-radius:12px\">\n<h3 style=\"font-size:30px;font-weight:700\">Renda e aplicação<\/h3>\n<p style=\"font-size:24px;line-height:1.35;color:#4A5263\">Renda, bordado, pedraria e flores em bolsos e costuras.<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<img src=\"img/965efd41f1267efa55b2bcef3f9ff9b5.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Jaqueta jeans com franjas longas\" style=\"width:398px;height:400px;object-fit:cover;border-radius:12px\">\n<h3 style=\"font-size:30px;font-weight:700\">Franja e barra<\/h3>\n<p style=\"font-size:24px;line-height:1.35;color:#4A5263\">Desfiado exagerado, barra dupla, bainha a fio.<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<img src=\"img/168f68f1cb16ba504f8cbcdf35921026.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Barra de calça jeans com desbotado forte e manchado\" style=\"width:398px;height:400px;object-fit:cover;border-radius:12px\">\n<h3 style=\"font-size:30px;font-weight:700\">Desgaste com intenção<\/h3>\n<p style=\"font-size:24px;line-height:1.35;color:#4A5263\">Manchas e desbotados pensados, não aleatórios.<\/p>\n<\/div>\n<\/div>\n<p style=\"font-size:26px;line-height:1.4;color:#1E40AF;font-weight:700\">Também nas passarelas de verão 27: costura torcida, patchwork em painéis grandes, cós de amarração e pregas.<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#4A5263\">Fontes: CapriTrends 2026, Who What Wear 2027, CHNews (out/2026)<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">14<\/p>\n\n<\/section>", "nota": "Os detalhes são a resposta ao alerta do CapriTrends: as silhuetas se consolidaram, então a diferenciação vem do acabamento. Na passarela de verão 27: Balenciaga, Stella McCartney e Ottolinger com costuras deslocadas; Gabriela Hearst com patchwork grande; Dolce &amp; Gabbana e Roberto Cavalli com aplicações; Miu Miu com cós de amarração; Valentino com plissado. Para o lojista de atacado, o recado é: um detalhe bem escolhido justifica preço; dez detalhes viram fantasia."}, {"id": "heritage", "html": "<section id=\"heritage\" data-transition=\"fade\" style=\"background:#0E1A33;color:#F3EFE6;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#F2C230\">Heritage · Workwear · Look total<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Jaqueta e calça vendidas juntas<\/h2>\n<\/div>\n<div style=\"display:flex;gap:48px;flex:1\">\n<div style=\"display:flex;gap:16px\">\n<img src=\"img/be06f9f820c20f5323cf108a1b02ccfb.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Jaqueta jeans escura com pesponto contrastante\" style=\"width:250px;height:600px;object-fit:cover;border-radius:12px\">\n<img src=\"img/22631c982b077a54950f3105f00f7f1f.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Bolso traseiro de jeans cru com etiqueta\" style=\"width:250px;height:600px;object-fit:cover;border-radius:12px\">\n<img src=\"img/35ec2102acca3db4189f3c544a59df76.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Calça cargo marrom com bolsos laterais\" style=\"width:250px;height:600px;object-fit:cover;border-radius:12px\">\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:28px\">\n<p style=\"font-size:30px;line-height:1.45;color:#B9C4D9\">No masculino de verão 27, o look total jeans dominou as passarelas, mostrando ao comprador como vender a peça em conjunto. Heritage e workwear atualizam o produto sem ficar óbvio.<\/p>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-left:6px solid #F2C230;padding:8px 0 8px 28px\">\n<h3 style=\"font-size:30px;font-weight:700\">Encorpado e cru<\/h3>\n<p style=\"font-size:26px;line-height:1.4;color:#B9C4D9\">Algarve 13 e 14 oz · Albatroz 12,5 oz<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-left:6px solid #F2C230;padding:8px 0 8px 28px\">\n<h3 style=\"font-size:30px;font-weight:700\">Conjunto escuro<\/h3>\n<p style=\"font-size:26px;line-height:1.4;color:#B9C4D9\">Algarve 12 oz Blue Black · Albatroz Blue Black<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-left:6px solid #F2C230;padding:8px 0 8px 28px\">\n<h3 style=\"font-size:30px;font-weight:700\">Cargo e utilitário<\/h3>\n<p style=\"font-size:26px;line-height:1.4;color:#B9C4D9\">Trindade PT tingido em peça · Tanguá<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#B9C4D9\">Fontes: FashionUnited (ago/2026), Candiani, CapriTrends 2026 · Fichas técnicas Capricórnio<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#B9C4D9;text-align:right\">15<\/p>\n\n<\/section>", "nota": "O look total jeans apareceu em Prada, Sacai, Saul Nash, Dolce &amp; Gabbana e outros no masculino de verão 27. Em Milão, no inverno 26–27 masculino, o clima foi de volta aos anos 2010: wide, lavagens sujas e tom sobre tom. A calça cargo militar também está nas apostas brasileiras de 2027. Argumento de venda: o lojista que compra jaqueta e calça do mesmo artigo vende o conjunto e aumenta o ticket médio."}, {"id": "div-mercado", "html": "<section id=\"div-mercado\" data-transition=\"push\" style=\"background:#1E40AF;color:#F3EFE6;font-family:'DM Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n<p style=\"font-size:32px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#F2C230\">Parte 3<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:160px;font-weight:700;line-height:1;text-transform:uppercase\">Quem compra e onde<\/h2>\n<p style=\"font-size:44px;line-height:1.3;width:1200px\">Comportamento do consumidor e as práticas que funcionam no online e na loja.<\/p>\n\n<\/section>", "nota": "Terceira parte: saímos do produto e vamos para o comportamento. Isso ajuda o vendedor a entender a dor do lojista, não só a tendência."}, {"id": "consumidor", "html": "<section id=\"consumidor\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Comportamento do consumidor<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">A dor é confiar no caimento<\/h2>\n<\/div>\n<div style=\"display:flex;gap:32px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px;border-top:4px solid #1E40AF;padding:32px 0 0 0\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:120px;font-weight:700;line-height:1;color:#1E40AF\">16,5%<\/p>\n<p style=\"font-size:28px;line-height:1.4\">dos homens confiam que o mesmo tamanho vai vestir igual na próxima compra<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px;border-top:4px solid #1E40AF;padding:32px 0 0 0\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:120px;font-weight:700;line-height:1;color:#1E40AF\">3 a 4<\/p>\n<p style=\"font-size:28px;line-height:1.4\">tamanhos pedidos de uma vez, online, para acertar a numeração<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px;border-top:4px solid #1E40AF;padding:32px 0 0 0\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:120px;font-weight:700;line-height:1;color:#1E40AF\">41%<\/p>\n<p style=\"font-size:28px;line-height:1.4\">é a precisão percebida das descrições de produto<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px;border-top:4px solid #8C6B4F;padding:32px 0 0 0\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:120px;font-weight:700;line-height:1;color:#8C6B4F\">70%<\/p>\n<p style=\"font-size:28px;line-height:1.4\">dos brasileiros querem jeans com diferencial, não só o básico<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:12px;background:#0E1A33;color:#F3EFE6;padding:36px 44px;border-radius:16px\">\n<p style=\"font-size:32px;line-height:1.4;font-weight:700\">Encolhimento controlado na ficha técnica vira grade consistente, e grade consistente vira cliente que volta.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1500px;font-size:24px;color:#4A5263\">Fontes: Clootrack, State of Men’s Denim 2026 (EUA, 55 mil avaliações) · IEMI/Vicunha via Texbrasil (estudo de 2020–21)<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">17<\/p>\n\n<\/section>", "nota": "Os três primeiros números são dos Estados Unidos, de um estudo com mais de 55 mil avaliações de jeans masculino publicado em 2026. O dado de 70% é brasileiro, mas é de um estudo mais antigo (IEMI e Vicunha, por volta de 2020–21); use como tendência, não como número atual. A lição para o atacado: o lojista perde cliente quando o 40 de uma remessa veste diferente do 40 da outra. Por isso a tolerância de encolhimento (±2%) e a estabilidade do tecido são argumentos de venda, não detalhe técnico."}, {"id": "online", "html": "<section id=\"online\" data-transition=\"fade\" style=\"background:#0E1A33;color:#F3EFE6;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#F2C230\">Mercado online<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">A calça também se vende ao vivo<\/h2>\n<\/div>\n<div style=\"display:flex;gap:64px;flex:1\">\n<div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px 48px\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:96px;font-weight:700;line-height:1;color:#F2C230\">+154%<\/p>\n<p style=\"font-size:26px;line-height:1.4;color:#B9C4D9\">vendas de moda no TikTok Shop Brasil, 1º sem/26 contra 2º sem/25<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:96px;font-weight:700;line-height:1;color:#F2C230\">Nº 1<\/p>\n<p style=\"font-size:26px;line-height:1.4;color:#B9C4D9\">calça feminina, o item de moda mais vendido no primeiro ano<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:96px;font-weight:700;line-height:1;color:#F2C230\">161x<\/p>\n<p style=\"font-size:26px;line-height:1.4;color:#B9C4D9\">crescimento do valor vendido em lives, maio/25 a maio/26<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:96px;font-weight:700;line-height:1;color:#F2C230\">57,8%<\/p>\n<p style=\"font-size:26px;line-height:1.4;color:#B9C4D9\">compram depois de descobrir o produto no próprio app<\/p>\n<\/div>\n<\/div>\n<div style=\"width:640px;display:flex;flex-direction:column;gap:20px;background:#F3EFE6;color:#0E1A33;padding:44px;border-radius:16px\">\n<h3 style=\"font-size:36px;font-weight:700\">O que funciona<\/h3>\n<ul style=\"font-size:28px;line-height:1.45\">\n<li>Vídeo curto do caimento em corpo real: frente, costas e sentado<\/li>\n<li>Medidas da peça (cós, gancho, boca) e composição na descrição<\/li>\n<li>Live de lançamento com grade e preço de atacado<\/li>\n<li>Close do tecido: peso, toque e elasticidade<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1500px;font-size:24px;color:#B9C4D9\">Fontes: TikTok Newsroom (jun/2026), Mercado &amp; Consumo (set/2026), Economic News Brasil (set/2026)<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#B9C4D9;text-align:right\">18<\/p>\n\n<\/section>", "nota": "Os números são do TikTok Shop Brasil no primeiro ano de operação. A Shopee também passou de 10 mil lives por dia em 2026, e na campanha de 8 de agosto chegou a 33 mil. Live commerce deixou de ser coisa de Black Friday e virou rotina. Para o lojista de atacado, isso muda o que ele precisa comprar: peças que ficam bem na câmera, com caimento que se explica em 15 segundos. Para o vendedor, é um argumento: “esse tecido segura o barrel no vídeo”."}, {"id": "loja", "html": "<section id=\"loja\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Loja física e atacado<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">A loja que explica o caimento vende mais<\/h2>\n<\/div>\n<div style=\"display:flex;gap:48px;flex:1\">\n<div style=\"display:flex;gap:16px\">\n<img src=\"img/addf5e4c8e652d47d6d52fdadc17baec.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Painel em loja explicando cada modelagem com foto e nome\" style=\"width:300px;height:600px;object-fit:cover;border-radius:12px\">\n<img src=\"img/212f8875085f77d959d84ec75da08466.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"Guia de caimento em display de loja ao lado das calças\" style=\"width:400px;height:600px;object-fit:cover;border-radius:12px\">\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:28px\">\n<ul style=\"font-size:30px;line-height:1.5\">\n<li>Parede de caimentos: uma peça por silhueta, com nome e explicação<\/li>\n<li>Arara organizada por caimento, não só por lavagem<\/li>\n<li>Vitrine com look total jeans e uma cor nova em destaque<\/li>\n<li>Etiqueta que conta a história: peso, composição, origem do algodão<\/li>\n<\/ul>\n<div style=\"display:flex;flex-direction:column;gap:12px;background:#FBF9F4;padding:28px 32px;border-radius:16px;border-left:8px solid #F2C230\">\n<p style=\"font-size:26px;line-height:1.4\"><b>Região da 44 (Goiânia):<\/b> cerca de 13 mil lojas, e a associação monta um marketplace próprio para enfrentar Shein e Shopee.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1500px;font-size:24px;color:#4A5263\">Fotos: CapriTrends 2026, Londres e Paris · Fonte: Correio (mai/2026)<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">19<\/p>\n\n<\/section>", "nota": "As duas fotos são de lojas visitadas na pesquisa do CapriTrends: grandes marcas explicam cada caimento com nome, foto e uma frase. É uma prática barata que o lojista de atacado pode copiar amanhã. O dado da Região da 44 mostra que até o polo atacadista físico está correndo para o digital: o lojista que compra de vocês vai vender cada vez mais por vídeo e marketplace, então a peça precisa se explicar sozinha."}, {"id": "sustentavel", "html": "<section id=\"sustentavel\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Sustentabilidade<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Fale do que está na ficha, não de promessa<\/h2>\n<\/div>\n<div style=\"display:flex;gap:24px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FBF9F4;padding:36px;border-radius:16px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:700;line-height:1;color:#1E40AF\">35%<\/p>\n<h3 style=\"font-size:32px;font-weight:700\">Cipó<\/h3>\n<p style=\"font-size:26px;line-height:1.4;color:#4A5263\">de resíduos têxteis reaproveitados · 10,5 oz · Angel Blue<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FBF9F4;padding:36px;border-radius:16px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:700;line-height:1;color:#1E40AF\">20%<\/p>\n<h3 style=\"font-size:32px;font-weight:700\">Tanguá<\/h3>\n<p style=\"font-size:26px;line-height:1.4;color:#4A5263\">de resíduos têxteis · 12 oz · azul e Black Black<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FBF9F4;padding:36px;border-radius:16px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:700;line-height:1;color:#1E40AF\">37%<\/p>\n<h3 style=\"font-size:32px;font-weight:700\">Glória<\/h3>\n<p style=\"font-size:26px;line-height:1.4;color:#4A5263\">de liocel, fibra de celulose · 8,4 oz · caimento fluido<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px;background:#FBF9F4;padding:36px;border-radius:16px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:700;line-height:1;color:#1E40AF\">25%<\/p>\n<h3 style=\"font-size:32px;font-weight:700\">Luna<\/h3>\n<p style=\"font-size:26px;line-height:1.4;color:#4A5263\">de liocel · 4,9 oz · camisaria e vestido<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:12px;border-left:8px solid #1E40AF;padding:12px 0 12px 36px\">\n<h3 style=\"font-size:32px;font-weight:700\">No mundo, para o verão 27<\/h3>\n<p style=\"font-size:28px;line-height:1.45;color:#4A5263\">Química sem PFAS, ozônio, laser e enzimas no lugar do permanganato, menos água e rastreio do impacto de cada rolo.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1500px;font-size:24px;color:#4A5263\">Fontes: Fichas técnicas Capricórnio · Denim Première Vision SS27<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">20<\/p>\n\n<\/section>", "nota": "Sustentabilidade vende quando é concreta. Em vez de dizer “tecido sustentável”, diga “35% desse tecido vem de resíduo têxtil reaproveitado”. A Denim Première Vision de verão 27 destacou química sem PFAS, alternativas ao permanganato de potássio (como o ZeroPP da Officina39), enzimas, ozônio controlado e máquinas que juntam laser, ozônio e e-flow. Isso interessa à lavanderia do cliente: peça a ele que pergunte à lavanderia quais processos ela usa."}, {"id": "div-treino", "html": "<section id=\"div-treino\" data-transition=\"push\" style=\"background:#F2C230;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:32px\">\n<p style=\"font-size:32px;font-weight:700;letter-spacing:4px;text-transform:uppercase\">Parte 4<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:160px;font-weight:700;line-height:1;text-transform:uppercase\">Treinamento<\/h2>\n<p style=\"font-size:44px;line-height:1.3;width:1200px\">Como transformar ficha técnica em conversa de venda.<\/p>\n\n<\/section>", "nota": "Parte de treinamento. Daqui em diante, as lâminas servem para o vendedor praticar. Sugestão: faça a dinâmica em duplas, um no papel de lojista, outro de vendedor."}, {"id": "traducao", "html": "<section id=\"traducao\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Tradutor de ficha técnica<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Cada número vira uma frase<\/h2>\n<\/div>\n<table style=\"font-size:26px;color:#0E1A33\">\n<tr><th style=\"width:20%\">Na ficha<\/th><th style=\"width:24%\">O que significa<\/th><th style=\"width:56%\">Como falar com o lojista<\/th><\/tr>\n<tr><td>Peso (oz)<\/td><td>estrutura e caimento<\/td><td>“De 12 a 14 oz segura o barrel. De 8 a 9 oz dá movimento à pantacourt.”<\/td><\/tr>\n<tr><td>Elastano<\/td><td>conforto<\/td><td>“Com 1%, parece rígido e veste fácil. Com 2%, é conforto total.”<\/td><\/tr>\n<tr><td>Elasticidade<\/td><td>quanto estica de lado<\/td><td>“O Bosco estica 40 a 44%: skinny confortável para quem não abre mão.”<\/td><\/tr>\n<tr><td>Encolhimento<\/td><td>ajuste do molde<\/td><td>“O Algarve encolhe 2%: o molde que você já usa funciona.”<\/td><\/tr>\n<tr><td>Tingimento<\/td><td>cor depois da lavagem<\/td><td>“Sulphur lava para o cinza; índigo, para o azul; o coating revela a base.”<\/td><\/tr>\n<tr><td>Composição<\/td><td>toque e história<\/td><td>“O liocel deixa o caimento fluido. O resíduo têxtil conta uma história.”<\/td><\/tr>\n<\/table>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1500px;font-size:24px;color:#4A5263\">Dados: Fichas técnicas Capricórnio (147 artigos em 5 linhas)<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">22<\/p>\n\n<\/section>", "nota": "Exercício: entregue uma ficha técnica impressa para cada vendedor e peça que ele diga, em uma frase, o que aquele artigo resolve para o lojista. Regra de ouro: nunca leia o número sem dizer o benefício. “11 oz, 1% de elastano” não vende; “parece rígido e veste fácil” vende. Lembrete técnico: a elasticidade nas fichas é a da trama, medida em tecido lavado, e o encolhimento tem tolerância de ±2 pontos."}, {"id": "script", "html": "<section id=\"script\" data-transition=\"fade\" style=\"background:#0E1A33;color:#F3EFE6;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#F2C230\">Roteiro de venda<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Escute, conecte, proponha<\/h2>\n<\/div>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;flex:1\">\n<div style=\"display:flex;flex-direction:column;gap:20px;background:#17284A;padding:40px;border-radius:16px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:96px;font-weight:700;line-height:1;color:#F2C230\">1<\/p>\n<h3 style=\"font-size:40px;font-weight:700\">Escute<\/h3>\n<p style=\"font-size:28px;line-height:1.45;color:#B9C4D9\">“Quem é a cliente que mais compra na sua loja?”<\/p>\n<p style=\"font-size:28px;line-height:1.45;color:#B9C4D9\">“O que girou rápido e o que ficou parado?”<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:20px;background:#17284A;padding:40px;border-radius:16px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:96px;font-weight:700;line-height:1;color:#F2C230\">2<\/p>\n<h3 style=\"font-size:40px;font-weight:700\">Conecte<\/h3>\n<p style=\"font-size:28px;line-height:1.45;color:#B9C4D9\">Traduza a tendência para o cliente dele: “Quem já tem barrel vai querer o próximo passo, a reta slim.”<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:20px;background:#17284A;padding:40px;border-radius:16px\">\n<p style=\"font-family:'Oswald', Arial, sans-serif;font-size:96px;font-weight:700;line-height:1;color:#F2C230\">3<\/p>\n<h3 style=\"font-size:40px;font-weight:700\">Proponha 1 + 1 + 1<\/h3>\n<ul style=\"font-size:28px;line-height:1.45;color:#B9C4D9\">\n<li>Uma base que gira<\/li>\n<li>Uma tendência consolidada<\/li>\n<li>Uma aposta em grade curta<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1500px;font-size:24px;color:#B9C4D9\">Exemplo: reta em Algarve 12 oz + barrel em Algarve 13 oz + capri em Baby Blue Melon<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#B9C4D9;text-align:right\">23<\/p>\n\n<\/section>", "nota": "Empatia aqui é prática: o lojista conhece o cliente dele melhor do que nós. O vendedor começa perguntando, não oferecendo. Depois conecta a tendência com o que o lojista já vende, para a novidade não parecer risco. Por fim, a regra 1+1+1 reduz o medo: a base garante o giro, a tendência garante atualização e a aposta em grade curta testa o novo sem encalhar estoque. Dinâmica sugerida: em duplas, 5 minutos para cada um fazer o papel de lojista."}, {"id": "colinha", "html": "<section id=\"colinha\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Colinha do vendedor<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Tendência, artigo, argumento<\/h2>\n<\/div>\n<table style=\"font-size:24px;color:#0E1A33\">\n<tr><th style=\"width:24%\">Tendência<\/th><th style=\"width:46%\">Artigos<\/th><th style=\"width:30%\">Argumento<\/th><\/tr>\n<tr><td>Barrel, balloon, wide<\/td><td>Algarve 12, 13 e 14 oz · Albatroz · Tanguá<\/td><td>segura a forma<\/td><\/tr>\n<tr><td>Slim reta e bootcut<\/td><td>Lamar · Salles · Torres · Alcaraz<\/td><td>parece rígido, veste fácil<\/td><\/tr>\n<tr><td>Skinny confortável<\/td><td>Bosco · Nadal · Ibira Flex<\/td><td>2% de elastano<\/td><\/tr>\n<tr><td>Capri, bermuda, saia<\/td><td>Araguaia · Borba · Braga · Una · Glória<\/td><td>leve e com movimento<\/td><\/tr>\n<tr><td>Brown e rosa<\/td><td>Algarve 10 oz Brown e Melon<\/td><td>cor nova, mesmo molde<\/td><\/tr>\n<tr><td>Índigo quase preto<\/td><td>Algarve Dark Blue · linhas Blue Black<\/td><td>o escuro da passarela<\/td><\/tr>\n<tr><td>Branco e cáqui<\/td><td>Trindade · Ubá · Lee · Monte (Branco, NAT, PT)<\/td><td>tinge a cor da vez<\/td><\/tr>\n<tr><td>Textura<\/td><td>Geribá · Taíba · Atins · Preá · Jeri · Sagi<\/td><td>o tecido é o detalhe<\/td><\/tr>\n<tr><td>Look total<\/td><td>Algarve 13 e 14 oz · Albatroz Blue Black<\/td><td>vende o conjunto<\/td><\/tr>\n<tr><td>Sustentável<\/td><td>Cipó · Tanguá · Glória · Luna<\/td><td>está na ficha<\/td><\/tr>\n<\/table>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1500px;font-size:24px;color:#4A5263\">Dados: Fichas técnicas Capricórnio · Cruzamento com as tendências deste radar<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:100px;font-size:24px;color:#4A5263;text-align:right\">24<\/p>\n\n<\/section>", "nota": "Esta é a lâmina para imprimir e deixar no bolso ou no balcão. Ela resume o deck inteiro em uma tabela. A linha Poly (Trancoso Max, Adonis, Viela, Rio) não aparece aqui porque a pesquisa mostra preferência por algodão predominante, mas ela continua sendo a resposta para quem precisa de preço mais baixo e caimento com conforto."}, {"id": "fontes", "html": "<section id=\"fontes\" data-transition=\"fade\" style=\"background:#F3EFE6;color:#0E1A33;font-family:'DM Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#1E40AF\">Para conferir<\/p>\n<h2 style=\"font-family:'Oswald', Arial, sans-serif;font-size:72px;font-weight:600;line-height:1.1;text-transform:uppercase\">Fontes da pesquisa<\/h2>\n<\/div>\n<div st
